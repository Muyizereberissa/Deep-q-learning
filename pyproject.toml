[project]
name = "deep-q-learning"
version = "0.1.0"
description = "From-scratch Deep Q-Network (DQN) agent for Atari Pong using PyTorch and Gymnasium"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "gymnasium[atari]>=0.29.1",
    "ale-py>=0.8.1",
    "autorom[accept-rom-license]>=0.6.1",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "opencv-python-headless>=4.8.0",
]

[project.scripts]
train = "train:main"
play = "play:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dqn"]

[tool.uv]
package = true
